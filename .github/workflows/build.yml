name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: |
          for i in 1 2 3; do
            gradle :app:assembleDebug --no-daemon && break
            if [ "$i" = "3" ]; then exit 1; fi
            echo "Спроба $i не вдалась, чекаємо 60 с"
            sleep 60
          done
      - name: Rename APK to IDB
        run: cp app/build/outputs/apk/debug/app-debug.apk IDB.apk
      - uses: actions/upload-artifact@v4
        with:
          name: IDB
          path: IDB.apk
